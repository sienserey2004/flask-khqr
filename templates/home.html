{% extends "base.html" %}
{% block content %}
<h1>Products</h1>
<div class="grid">
  {% for p in products %}
  <div class="card">
    <a href="{{ url_for('product_detail', product_id=p.id) }}">
      <img src="{{ p.image }}" alt="{{ p.name }}">
      <div class="body">
        <h3>{{ p.name }}</h3>
        <div class="price">${{ "%.2f"|format(p.price) }}</div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
