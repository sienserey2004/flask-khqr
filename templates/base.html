<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KHQR Shop{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f7; color: #222; }
    header { background: #e1232e; color: #fff; padding: 16px; }
    header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 20px; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card img { width: 100%; height: 180px; object-fit: cover; }
    .card .body { padding: 12px 16px 16px; }
    .card a { color: inherit; text-decoration: none; }
    .price { color: #e1232e; font-weight: 700; font-size: 18px; }
    .btn { display: inline-block; background: #e1232e; color: #fff; border: 0; padding: 12px 24px;
           border-radius: 8px; font-size: 16px; cursor: pointer; text-decoration: none; }
    .btn.secondary { background: #444; }
    .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; background: #fff; padding: 24px; border-radius: 12px; }
    .detail img { width: 100%; border-radius: 8px; }
    .center { text-align: center; background: #fff; padding: 24px; border-radius: 12px; }
    .qr { max-width: 300px; width: 100%; }
    .status { font-weight: 600; margin: 12px 0; }
    @media (max-width: 640px) { .detail { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><a href="{{ url_for('home') }}">KHQR Shop</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
